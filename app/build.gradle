plugins {
    id 'com.android.application'
}

android {
    namespace 'com.metahumanz.pacilread'
    compileSdk 33

    defaultConfig {
        applicationId "com.metahumanz.pacilread"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
